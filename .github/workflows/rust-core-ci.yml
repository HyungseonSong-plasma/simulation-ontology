name: Rust Core CI

on:
  push:
    branches:
      - main
      - "impl/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: fmt-build-test-clippy-architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.80.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.80.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Exercise standalone external-project conformance workflow
        env:
          SOL_REFERENCE_ADAPTER: ${{ github.workspace }}/target/debug/sol-adapter-authoring-skeleton
          SOL_MOCK_ADAPTER: ${{ github.workspace }}/target/debug/sol-mock-adapter-stdio
          SOL_TRANSPORT_PROBE: ${{ github.workspace }}/target/debug/sol-transport-error-probe
          SOL_SEMANTIC_ADVERSARY: ${{ github.workspace }}/target/debug/sol-conformance-adversary
        run: |
          external_fixtures="$RUNNER_TEMP/sol-adapter-protocol-0.1"
          cp -R fixtures/adapter-protocol/0.1 "$external_fixtures"
          export SOL_CONFORMANCE_FIXTURES="$external_fixtures"

          cargo fmt --manifest-path examples/external-project-conformance/Cargo.toml -- --check
          cargo test --manifest-path examples/external-project-conformance/Cargo.toml --locked

          first="$RUNNER_TEMP/m0.6-external-conformance-1.json"
          second="$RUNNER_TEMP/m0.6-external-conformance-2.json"
          cargo run --manifest-path examples/external-project-conformance/Cargo.toml --locked --quiet > "$first"
          cargo run --manifest-path examples/external-project-conformance/Cargo.toml --locked --quiet > "$second"
          cmp "$first" "$second"
          python3 scripts/validate_m06_external_conformance_snapshot.py "$first"

      - name: Diagnose standalone external runtime v0.2 lock
        run: |
          cargo fmt --manifest-path examples/external-runtime-v02/Cargo.toml -- --check
          cp examples/external-runtime-v02/Cargo.lock "$RUNNER_TEMP/m0.9-committed-Cargo.lock"
          cargo generate-lockfile --manifest-path examples/external-runtime-v02/Cargo.toml --offline
          diff -u "$RUNNER_TEMP/m0.9-committed-Cargo.lock" examples/external-runtime-v02/Cargo.lock || true
          false

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run architecture counterexamples
        run: cargo test -p sol-core-model --test architecture_counterexamples --locked

      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate Public Contract JSON schemas
        run: python3 scripts/validate_public_contract_schemas.py

      - name: Validate Adapter Protocol JSON schemas
        run: python3 scripts/validate_adapter_protocol_schemas.py
