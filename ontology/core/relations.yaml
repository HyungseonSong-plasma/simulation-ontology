version: "0.1"
status: consolidating

relations:
  has_model:
    description: Associates a Simulation context with the single SimulationModel it uses.
    domain: Simulation
    range: SimulationModel
    source_cardinality:
      min: 1
      max: 1
    ownership: non_owning_reference

  has_task:
    description: Associates a Simulation context with one or more SimulationTasks performed in that context.
    domain: Simulation
    range: SimulationTask
    source_cardinality:
      min: 1
      max: unbounded
    ownership: non_owning_reference
    order_semantics: none

  uses_model:
    description: Binds a SimulationTask to exactly one SimulationModel to which the task applies.
    domain: SimulationTask
    range: SimulationModel
    source_cardinality:
      min: 1
      max: 1

  has_analysis:
    description: Binds a SimulationTask to exactly one Analysis defining the computational question for that task.
    domain: SimulationTask
    range: Analysis
    source_cardinality:
      min: 1
      max: 1

  includes_component:
    description: Direct non-owning structural membership between an aggregate/model context and a compatible semantic component.
    source_cardinality:
      min: 0
      max: unbounded
    ownership: non_owning_reference
    order_semantics: none
    transitive: false
    endpoint_matching: canonical_type_or_subtype
    allowed_pairs:
      - source: SimulationModel
        targets: [PhysicsModel, MathematicalModel, ConstitutiveModel, SpatialModel, MaterialModel, ConditionModel, NumericalModel, ObservationModel]
      - source: PhysicsModel
        targets: [Phenomenon, Process, Interaction]
      - source: MathematicalModel
        targets: [Formulation, Equation, Field, Operator, MathematicalParameter]
      - source: ConstitutiveModel
        targets: [ClosureRelation, PropertyModel]
      - source: SpatialModel
        targets: [Geometry, Domain, Boundary, SpatialInterface, Scope]
      - source: MaterialModel
        targets: [Material, Species, MaterialProperty]
      - source: ConditionModel
        targets: [BoundaryCondition, InitialCondition, Source, Load]
      - source: NumericalModel
        targets: [Discretization, Mesh, NumericalApproximation]
      - source: ObservationModel
        targets: [Quantity, Probe, Integral, Dataset, Output]
      - source: SolverConfiguration
        targets: [NonlinearSolver, LinearSolver, Preconditioner, ConvergenceCriterion]

  represented_by:
    description: Connects a physical model or concept to a mathematical representation.
    domain: PhysicsModel
    range: MathematicalModel

  closed_by:
    description: Connects a mathematical model to a constitutive or closure model required to close it.
    domain: MathematicalModel
    range: ConstitutiveModel

  parameterized_by:
    description: Connects a model to material or physical properties used as parameters.
    domain: ConstitutiveModel
    range: MaterialModel

  defined_on:
    description: Associates a model entity with its spatial definition or scope.
    domain: MathematicalModel
    range: SpatialModel

  discretized_by:
    description: Connects a mathematical model to its numerical representation.
    domain: MathematicalModel
    range: NumericalModel

  applied_to:
    description: Associates an individual condition or forcing with at least one field, equation, or spatial scope it constrains or forces.
    domain:
      - BoundaryCondition
      - InitialCondition
      - Source
      - Load
    range:
      - Field
      - Equation
      - Scope
    endpoint_matching: canonical_type_or_subtype
    source_cardinality:
      min: 1
      max: unbounded
    order_semantics: none

  analyzed_by:
    description: Derived relation connecting a SimulationModel to an Analysis when at least one SimulationTask uses that model and has that analysis.
    domain: SimulationModel
    range: Analysis
    derived: true
    derivation: "M analyzed_by A iff exists T: T uses_model M and T has_analysis A"
    order_semantics: none

  solved_by:
    description: Associates an analysis with its numerical solver configuration.
    domain: Analysis
    range: SolverConfiguration

  produces:
    description: Indicates that a simulation task produces a simulation result.
    domain: SimulationTask
    range: Result
    source_cardinality:
      min: 0
      max: unbounded

  observed_by:
    description: Associates a simulation result with observation or output definitions.
    domain: Result
    range: ObservationModel

accepted_semantics_not_yet_transcribed:
  - Relation/constraint provenance requirements accepted by prior ADRs.
  - Namespace-qualified identity requirements for exported relation terms.
  - Complete machine-schema validation for ADR-0015 cardinality and derived-relation metadata.
  - Final structural schema enforcement for ADR-0016 allowed-pair and subtype-aware endpoint matching semantics.

open_language_schema_decisions:
  - Complete relation cardinalities beyond ADR-0015 and ADR-0016.
  - Required versus optional Core relations beyond accepted focused contracts.
  - Whether selected broad domains/ranges should later be narrowed by Interface requirements or additional subtype constraints.
  - Final canonical YAML/JSON Schema field spelling for relation cardinality, derived-relation, allowed-pair, and endpoint-matching rules.

notes:
  - ADR-0015 defines `has_model`, `has_task`, `uses_model`, `has_analysis`, the derived `analyzed_by` rule, and `produces` minimum-zero semantics.
  - ADR-0016 defines `includes_component`, its authoritative allowed-pair matrix, canonical subtype-aware endpoint matching for this contract, and the repaired `applied_to` domain/cardinality.
  - `includes_component` is direct-only, non-owning, non-transitive, and unordered; recursive traversal is a query/view rather than an inferred stored relation.
  - Allowed-pair entries are the authority for `includes_component`; tools must not broaden them from a derived range summary.
  - `produces` is normatively `SimulationTask -> Result`; backend execution structure does not narrow its domain.
  - Backend-local relations and handles belong to backend ontologies/Profile/Adapter layers, not this Core registry.
