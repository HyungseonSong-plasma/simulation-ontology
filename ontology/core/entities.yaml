version: "0.1"
status: consolidating

# Canonical Core Entity Type registry.
#
# IMPORTANT:
# - Presence in this registry asserts semantic identity only.
# - Taxonomic inheritance is NEVER inferred from file order or grouping.
# - Any normative inheritance edge must be written explicitly with `is_a`
#   and must satisfy ADR-0008 (0..1 direct Entity Type parent).
# - Structural composition/grouping is represented by explicit Relations once
#   those relation contracts are accepted; it is not encoded with `children`.

entities:
  Simulation: {}
  SimulationModel: {}
  SimulationTask: {}

  PhysicsModel: {}
  Phenomenon: {}
  Process: {}
  Interaction: {}

  MathematicalModel: {}
  Formulation: {}
  Equation: {}
  Field: {}
  Operator: {}
  MathematicalParameter: {}

  ConstitutiveModel: {}
  ClosureRelation: {}
  PropertyModel: {}

  SpatialModel: {}
  Geometry: {}
  Domain: {}
  Boundary: {}
  SpatialInterface: {}
  Scope: {}

  MaterialModel: {}
  Material: {}
  Species: {}
  MaterialProperty: {}

  ConditionModel: {}
  BoundaryCondition: {}
  InitialCondition: {}
  Source: {}
  Load: {}

  NumericalModel: {}
  Discretization: {}
  Mesh: {}
  NumericalApproximation: {}

  ObservationModel: {}
  Quantity: {}
  Probe: {}
  Integral: {}
  Dataset: {}
  Output: {}

  Analysis: {}
  StationaryAnalysis:
    is_a: Analysis
  TransientAnalysis:
    is_a: Analysis
  FrequencyDomainAnalysis:
    is_a: Analysis
  EigenvalueAnalysis:
    is_a: Analysis
  ParametricAnalysis:
    is_a: Analysis
  OptimizationAnalysis:
    is_a: Analysis

  SolverConfiguration: {}
  NonlinearSolver: {}
  LinearSolver: {}
  Preconditioner: {}
  ConvergenceCriterion: {}

  Result: {}

accepted_semantics_not_yet_transcribed:
  - Complete composition relations connecting Simulation, SimulationModel, and SimulationTask.
  - Complete taxonomic is_a edges for model/numerical/observation concepts where taxonomy is normatively justified.
  - Interface implementation metadata (`implements`, Interface extension) in a dedicated language-level machine representation.
  - Value, ValueDefinition, PhysicalDimension, and Unit final language-level representation as permitted by their accepted ADR boundaries.

open_language_schema_decisions:
  - Canonical relation names/cardinalities for top-level Simulation composition.
  - Whether additional Core concepts require explicit is_a edges versus composition/association relations.
  - Final serialization location for language-level Interface definitions.

notes:
  - `Interface` is reserved for the ADR-0008 capability-contract language construct.
  - The former spatial concept named `Interface` is `SpatialInterface` under ADR-0014.
  - `Result` is declared to make the existing `produces` and `observed_by` relation contracts referentially complete.
  - Software-specific concepts such as MOOSE Kernel, COMSOL Physics Feature, and Ansys analysis objects remain excluded from the Core taxonomy.
