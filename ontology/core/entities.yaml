version: "0.1"
status: design_stage_consolidated

# Canonical Core Entity Type registry.
#
# IMPORTANT:
# - Presence in this registry asserts semantic identity only.
# - Taxonomic inheritance is NEVER inferred from file order or grouping.
# - Any normative inheritance edge must be written explicitly with `is_a`
#   and must satisfy ADR-0008 (0..1 direct Entity Type parent).
# - Structural composition/grouping is represented by explicit Relations; it
#   is not encoded with `children`.
# - Interface is a separate language-level schema construct under ADR-0025 and
#   is intentionally not listed as an Entity Type here.
# - Value, UnitReference, and DimensionVector are typed payloads under
#   ADR-0026; only identified/relation-participating ValueDefinition instances
#   are Entity instances.

entities:
  Simulation: {}
  SimulationModel: {}
  SimulationTask: {}

  PhysicsModel: {}
  Phenomenon: {}
  Process: {}
  Interaction: {}

  MathematicalModel: {}
  Formulation: {}
  Equation: {}
  Field: {}
  Operator: {}
  MathematicalParameter: {}

  ConstitutiveModel: {}
  ClosureRelation: {}
  PropertyModel: {}

  SpatialModel: {}
  Geometry: {}
  Domain: {}
  Boundary: {}
  SpatialInterface: {}
  Scope: {}

  MaterialModel: {}
  Material: {}
  Species: {}
  MaterialProperty: {}

  ConditionModel: {}
  BoundaryCondition: {}
  InitialCondition: {}
  Source: {}
  Load: {}

  NumericalModel: {}
  Discretization: {}
  Mesh: {}
  NumericalApproximation: {}

  ObservationModel: {}
  Quantity: {}
  Probe: {}
  Integral: {}
  Dataset: {}
  Output: {}

  Analysis: {}
  StationaryAnalysis:
    is_a: Analysis
  TransientAnalysis:
    is_a: Analysis
  FrequencyDomainAnalysis:
    is_a: Analysis
  EigenvalueAnalysis:
    is_a: Analysis
  ParametricAnalysis:
    is_a: Analysis
  OptimizationAnalysis:
    is_a: Analysis

  SolverConfiguration: {}
  NonlinearSolver: {}
  LinearSolver: {}
  Preconditioner: {}
  ConvergenceCriterion: {}

  Result: {}
  ValueDefinition: {}

accepted_semantics_not_yet_transcribed: []

open_language_schema_decisions: []

deferred_post_v0_1:
  - Additional Core is_a edges beyond the accepted Analysis specializations require independent substitutability evidence; absence is not an unfinished v0.1 inheritance assertion.
  - Richer Result, material/species, numerical, observation, and solver sub-taxonomies remain extension/future work unless a later use case requires them.
  - Multi-model/co-simulation taxonomy and composition remain deferred.

notes:
  - `SimulationTask` is a distinct Entity Type that reifies application of one Analysis to one SimulationModel under ADR-0015; Analysis does not inherit from SimulationTask.
  - `Interface` is reserved for the ADR-0008 capability-contract language construct and has focused schemas under ADR-0025.
  - The former spatial concept named `Interface` is `SpatialInterface` under ADR-0014.
  - `Result` is declared to make the existing `produces` and `observed_by` relation contracts referentially complete.
  - `ValueDefinition` denotes only reified identified/relation-participating definition instances under ADR-0026; dependency-free local definitions may remain typed InlineValueDefinition payloads.
  - `Value`, `UnitReference`, and `DimensionVector` are not Core Entity Types in v0.1.
  - Software-specific concepts such as MOOSE Kernel, COMSOL Physics Feature, and Ansys analysis objects remain excluded from the Core taxonomy.
