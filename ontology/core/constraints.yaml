version: "0.1"
status: consolidating

constraints:
  backend_independence:
    description: Core ontology entities and relations must not require software-specific object types.

  model_task_separation:
    description: SimulationModel defines what is modeled; SimulationTask is an identifiable application of an Analysis to a model.

  simulation_single_model:
    description: Every Simulation has exactly one has_model target under ADR-0015.

  simulation_requires_task:
    description: Every Simulation has at least one has_task target under ADR-0015.

  simulation_task_model_consistency:
    description: If Simulation S has_model M and has_task T, then T uses_model M must hold.

  task_single_model:
    description: Every SimulationTask has exactly one uses_model target under ADR-0015.

  task_single_analysis:
    description: Every SimulationTask has exactly one has_analysis target under ADR-0015.

  analyzed_by_derivation:
    description: M analyzed_by A iff at least one SimulationTask T has uses_model M and has_analysis A; materialized analyzed_by edges are derived data, not a second source of truth.

  result_not_required_pre_execution:
    description: A SimulationTask may have zero produces edges before execution; produces cardinality is 0..*.

  component_allowed_pair:
    description: Every includes_component edge must satisfy one authoritative ADR-0016 allowed source-target pair after canonical equal-or-subtype endpoint matching.

  component_membership_direct_only:
    description: includes_component is non-transitive; recursive traversal does not create additional stored semantic edges.

  component_membership_non_owning:
    description: includes_component does not imply exclusive ownership or deletion/lifecycle cascade; compatible component reuse is permitted unless another constraint forbids it.

  relation_endpoint_subtype_matching:
    description: For ADR-0016 includes_component and applied_to endpoint checks, an instance matches an allowed type when at least one consistent canonical semantic type is equal to or a subtype of the allowed type; type inconsistency fails before relation matching.

  condition_target_required:
    description: Every BoundaryCondition, InitialCondition, Source, or Load instance must have at least one applied_to target that is equal to or a subtype of Field, Equation, or Scope.

  condition_model_not_applied_directly:
    description: ConditionModel is an aggregate context and is not itself an applied_to source merely because it includes condition or forcing components.

  core_cardinality_represented_by_source:
    type: cardinality
    canonical_id: core.cardinality.represented_by.source
    relation: represented_by
    direction: source
    min: 0
    max: unbounded
    description: Canonical ADR-0017 Core outgoing cardinality authority for represented_by.

  core_cardinality_closed_by_source:
    type: cardinality
    canonical_id: core.cardinality.closed_by.source
    relation: closed_by
    direction: source
    min: 0
    max: unbounded
    description: Canonical ADR-0017 Core outgoing cardinality authority for closed_by.

  core_cardinality_parameterized_by_source:
    type: cardinality
    canonical_id: core.cardinality.parameterized_by.source
    relation: parameterized_by
    direction: source
    min: 0
    max: unbounded
    description: Canonical ADR-0017 Core outgoing cardinality authority for parameterized_by.

  core_cardinality_defined_on_source:
    type: cardinality
    canonical_id: core.cardinality.defined_on.source
    relation: defined_on
    direction: source
    min: 0
    max: unbounded
    description: Canonical ADR-0017 Core outgoing cardinality authority for defined_on.

  core_cardinality_discretized_by_source:
    type: cardinality
    canonical_id: core.cardinality.discretized_by.source
    relation: discretized_by
    direction: source
    min: 0
    max: unbounded
    description: Canonical ADR-0017 Core outgoing cardinality authority for discretized_by.

  core_cardinality_solved_by_source:
    type: cardinality
    canonical_id: core.cardinality.solved_by.source
    relation: solved_by
    direction: source
    min: 0
    max: unbounded
    description: Canonical ADR-0017 Core outgoing cardinality authority for solved_by.

  core_cardinality_observed_by_source:
    type: cardinality
    canonical_id: core.cardinality.observed_by.source
    relation: observed_by
    direction: source
    min: 0
    max: unbounded
    description: Canonical ADR-0017 Core outgoing cardinality authority for observed_by.

  cardinality_projection_consistency:
    description: For ADR-0017 relations, relation-side source_cardinality is a required projection of the canonical Core Cardinality Constraint; missing or mismatched projection is a transcription failure and never an override/intersection contributor.

  physics_math_separation:
    description: Physical meaning and mathematical representation must remain distinct and connected through explicit relations.

  analysis_solver_separation:
    description: Analysis defines the computational question; SolverConfiguration defines the numerical algorithm used to solve it.

  explicit_scope:
    description: Conditions and spatially applied model entities should reference an explicit Scope where applicable.

  single_direct_entity_inheritance:
    description: An Entity Type has at most one direct is_a parent; orthogonal reusable contracts use Interface composition under ADR-0008.

  interface_identity_disambiguation:
    description: Interface denotes the capability-contract language construct; the spatial entity is SpatialInterface under ADR-0014.

  qrc_closed_snapshot:
    description: Qualified Relation Cardinality instance PASS/FAIL evaluation requires a complete immutable relation snapshot under ADR-0012.

accepted_semantics_not_yet_transcribed:
  - Namespace and stable exported-identity validation from ADR-0009.
  - Unit and PhysicalDimension compatibility rules from ADR-0004 and ADR-0005.
  - Full six-family Constraint structural schema and composition algebra from ADR-0007.
  - Interface requirement/extension/implementation validation from ADR-0008.
  - Qualified Relation Cardinality schema and deterministic diagnostics from ADR-0012.
  - Canonical machine-schema encoding/tests for ADR-0015 relation cardinalities and derived relation consistency.
  - Canonical machine-schema enforcement/tests for ADR-0016 allowed-pair and endpoint-matching rules.
  - Final schema enforcement/tests for ADR-0017 canonical cardinality authority and relation projection consistency.

open_language_schema_decisions:
  - Required versus optional relation refinements supplied by domain/interface/profile contracts beyond the generic Core baseline.
  - Core graph acyclicity rules beyond already accepted specialized contracts.
  - Final canonical authoring/serialization schema for the complete Core package.
  - Stable package-level serialization mechanism for canonical Constraint identity and deduplication.
  - Multi-model/co-simulation semantics, if later justified by evidence.

notes:
  - Cardinality semantics remain normative Constraints under ADR-0007.
  - ADR-0017 relation-side cardinality fields are projections only and must equal the normalized canonical Core Constraint.
  - Accepted semantics are not considered pending architecture questions merely because their final JSON Schema/SHACL transcription is incomplete.
  - Backend installation, licensing, and production Adapter execution do not participate in these Core model-instance constraints.
